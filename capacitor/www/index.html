<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14244b">
<meta name="yasno-build" content="dev">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Ясно</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:wght@500;600&display=swap">
<style>
:root{--paper:#f8f8fb;--card:#fff;--ink:#14244b;--mute:#667090;--line:#e2e5ef;--navy:#14244b;--pink:#e48aa0;--pinkbg:#fbe5ea;--ok:#2c7a5b;--okbg:#e1f2ea;--g:#2c7a5b;--y:#b8800f;--r:#c4495a}
@media (prefers-color-scheme:dark){:root{--paper:#0d1530;--card:#15214a;--ink:#eef1fb;--mute:#9aa4c4;--line:#27335f;--navy:#0a1128;--pink:#f0a2b5;--pinkbg:#4a2c40;--ok:#6fd0a4;--okbg:#17362f;--g:#6fd0a4;--y:#efbf5c;--r:#f08a98;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.4 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px}
.top small{font-size:12px;opacity:.7}.tr{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
h1{margin:0;font:600 24px/1.2 "Literata",Georgia,serif}
.role{font-size:12px;font-weight:600;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 10px}
main{flex:1;overflow-y:auto;padding:6px 18px 24px}
.lead{font:500 21px/1.3 "Literata",Georgia,serif;margin:18px 0 4px}
.sub{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:14px}
.sub button{padding:10px 0;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.sub button[aria-selected=true]{color:var(--ink);border-color:var(--pink)}
h2{font:600 15px "Golos Text",sans-serif;margin:24px 0 2px}
.it{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.bx{width:26px;height:26px;border-radius:7px;border:1.8px solid var(--mute);display:grid;place-items:center;color:var(--card);flex:none}
.bx svg{width:15px;height:15px;stroke-width:3}.done .bx{background:var(--ink);border-color:var(--ink)}
.done .t{text-decoration:line-through;color:var(--mute)}.bd{flex:1;min-width:0}
.t{font-size:16px;font-weight:500}.s{font-size:13px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--pinkbg);margin-top:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.btn{background:var(--ink);color:var(--card);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.sm{padding:6px 11px;font-size:13px;min-height:36px;border-radius:8px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.wide{width:100%}
.lnk{font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:4px;text-decoration-thickness:2px;margin-top:12px;display:inline-block;color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.am{font:600 19px "Literata",Georgia,serif;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.dr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--pinkbg);display:grid;place-items:center;font:600 14px "Literata",serif;flex:none}
.sp{margin-left:auto;display:flex;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}.cg{background:var(--g)}.cy{background:var(--y)}.cr{background:var(--r)}
.st{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0;gap:2px}.st i{display:block}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.leg>*{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:var(--card)}
.leg button[aria-pressed=true]{border-color:var(--ink)}.leg b{display:block;font:600 24px "Literata",serif}.leg span{font-size:12px;color:var(--mute)}
nav{display:flex;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;position:relative}
nav button[aria-current=page]{color:var(--ink)}nav button[aria-current=page]::after{content:"";position:absolute;bottom:-2px;width:18px;height:3px;border-radius:2px;background:var(--pink)}
nav .fab{flex:none;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin:0 6px;padding:0}nav .fab::after{display:none}
#bg{position:fixed;inset:0;background:rgba(10,17,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}#bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:90%;overflow-y:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}.sheet h3,.reg h3{margin:0 0 2px;font:600 21px "Literata",Georgia,serif}
textarea,input.f,select.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--paper);color:var(--ink);margin-top:10px}textarea{min-height:110px}
.mn{display:flex;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}.mn small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.reg{padding:calc(env(safe-area-inset-top,0px) + 28px) 22px 28px;overflow-y:auto;height:100%}.reg .logo{font:600 34px "Literata",serif;margin-bottom:6px}
.code{font:600 30px "Literata",serif;letter-spacing:.14em;margin:8px 0}
#toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--card);border-radius:10px;padding:11px 14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}#toast.on{opacity:1}
.hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,17,40,.68);z-index:30;pointer-events:none;transition:.25s}
.tip{position:fixed;left:16px;right:16px;max-width:400px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:14px;padding:16px;z-index:31;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tip b{font:600 17px "Literata",serif}.tip p{margin:6px 0 0;font-size:14.5px;color:var(--mute)}.tip .btns{justify-content:space-between;align-items:center}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--mute)}.ck input{margin-top:3px;width:20px;height:20px;flex:none}.ck a{color:var(--ink);font-weight:600}
.empty{color:var(--mute);padding:20px 0;font-size:15px}.err{color:var(--r);font-size:14px;margin-top:8px}
.fieldlabel{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-top:12px}.reg h2{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}.reg .f{margin-top:5px}</style>
</head>
<body>
<div id="app"></div><div id="bg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div><div id="toast" role="status"></div>
<script type="module">
import cfg from './supabase-config.js';
import {isAndroidApk,checkApkUpdate,installApkUpdate,apkDiagnostics} from './apk-updater.js';
import {syncDeadlineReminders,clearDeadlineReminders,getReminderDiagnostics,testReminder,requestExactReminderPermission} from './deadline-reminders.js';
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',gen=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>AL[b%AL.length]).join('');
const rub=n=>Number(n).toLocaleString('ru-RU')+' ₸';
const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtD=s=>{if(!s)return'';const a=isoL(new Date()),b=isoL(new Date(Date.now()+864e5));return s===a?'Сегодня':s===b?'Завтра':new Date(s+'T12:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})};
const tg=(d,n)=>{const x=[fmtD(d),n].filter(Boolean).join(' · ');return x?`<span class="tag">${esc(x)}</span>`:''};
const WD=[/воскрес/i,/понедельн/i,/вторник/i,/сред/i,/четверг/i,/пятниц/i,/суббот/i];
function dateWord(w){if(!w)return'';const d=new Date();if(/послезавтра/i.test(w))d.setDate(d.getDate()+2);else if(/завтра/i.test(w))d.setDate(d.getDate()+1);else if(!/сегодня/i.test(w)){const i=WD.findIndex(r=>r.test(w));if(i<0)return'';d.setDate(d.getDate()+((i-d.getDay()+7)%7||7))}return isoL(d)}
const I={home:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/>',money:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5M16 5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}

const sb=createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={tab:'home',sub:'t',step:0,mode:'register',reg:{},q:'',f:''};
let uid=null,U=null,C=null,mem=[],tasks=[],hw=[],funds=[],boot=false,installEv=null,channel=null,loading=false;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;draw()});
if(!isAndroidApk() && 'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
if(isAndroidApk() && 'serviceWorker' in navigator){
 // Android APK использует встроенные файлы, а не PWA-кеш старой версии.
 navigator.serviceWorker.getRegistrations().then(async regs=>{
   if(regs.length){
     await Promise.all(regs.map(x=>x.unregister()));
     if('caches' in window)await Promise.all((await caches.keys()).map(key=>caches.delete(key)));
     if(!sessionStorage.yasnoSwCleanup){sessionStorage.yasnoSwCleanup='1';location.reload()}
   }
 }).catch(e=>console.warn('Service worker cleanup:',e));
}
let apkUpdate=null;
let updateBusy=false;
let updateState='Нажмите «Проверить обновления»';
let notificationStatus='Нажмите «Проверить состояние», чтобы увидеть разрешения и очередь Android.';
async function checkForApkUpdate(silent=false){
 if(!isAndroidApk()||updateBusy)return;
 updateBusy=true; updateState='Проверяем GitHub Releases…'; if(S.tab==='more')draw();
 try {apkUpdate=await checkApkUpdate();updateState=apkUpdate.updateAvailable?`Новая версия ${apkUpdate.latest} (установлена ${apkUpdate.installed})`:`Установлена актуальная версия ${apkUpdate.installed}`;if(apkUpdate.updateAvailable&&!silent)toast('Доступна версия '+apkUpdate.latest)}
 catch(e){updateState=e.message||String(e);if(!silent)toast(updateState)}
 finally{updateBusy=false;if(S.tab==='more')draw()}
}
async function startApkUpdate(){
 if(!apkUpdate?.updateAvailable||updateBusy)return;
 if(!confirm(`Скачать обновление Ясно ${apkUpdate.latest}? После загрузки Android попросит подтвердить установку.`))return;
 updateBusy=true; updateState='Скачивание APK…';draw();
 try{await installApkUpdate(apkUpdate,p=>{updateState=p.percent>=0?`Загрузка APK: ${p.percent}%`:'Загружаем APK…';const label=document.getElementById('apk-update-status');if(label)label.textContent=updateState});updateState='Установщик Android открыт. Подтвердите обновление.'}
 catch(e){updateState=e.message||String(e);toast(updateState)}
 finally{updateBusy=false;draw()}
}
let lastUpdateCheck=0;
function autoCheckApk(){
 if(!isAndroidApk()||!U?.cls||updateBusy||Date.now()-lastUpdateCheck<300000)return;
 lastUpdateCheck=Date.now();checkForApkUpdate(false);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoCheckApk()});
const check=(result)=>{if(result.error)throw result.error;return result.data};
const rpc=(fn,args={})=>sb.rpc(fn,args).then(check);
const must=(query)=>query.then(check);
const errorMsg=e=>({invalid_credentials:'Неверный email или пароль',email_not_confirmed:'Подтвердите email по ссылке в письме',user_already_exists:'Пользователь уже существует'}[e.code]||e.message||String(e));
const me=()=>mem.find(m=>m.id===uid)||{},adm=()=>!!me().admin;
const famMem=f=>mem.filter(m=>m.fam===f);
const debts=f=>funds.filter(x=>!(x.paid||{})[f]).length;
const stat=f=>{const n=debts(f);return n===0?'g':n===1?'y':'r'};
async function initSession(){
  if(loading)return;loading=true;
  try {
    const {data:{session},error}=await sb.auth.getSession();if(error)throw error;
    uid=session?.user.id||null;
    if(!uid){if(isAndroidApk())clearDeadlineReminders().catch(console.warn);U=null;C=null;mem=[];tasks=[];hw=[];funds=[];channel&&sb.removeChannel(channel);channel=null;boot=true;draw();return}
    const md=session.user.user_metadata||{};
    let p=check(await sb.from('profiles').select('*').eq('id',uid).maybeSingle());
    if(!p && md.first_name){
      p=check(await sb.from('profiles').upsert({id:uid,first_name:md.first_name,last_name:md.last_name,middle_name:md.middle_name||'',phone:md.phone,relation:md.relation,child_first:md.child_first,child_last:md.child_last,grade:md.grade,school:md.school||'',city:md.city||''}).select().single());
    }
    if(!p){U=null;S.mode='register';boot=true;draw();return}
    const m=check(await sb.from('members').select('*').eq('user_id',uid).maybeSingle());
    U={name:p.first_name+' '+p.last_name,phone:p.phone,kid:p.child_first+' '+p.child_last,kidClass:p.grade,profile:p,cls:m?.class_code||null,fam:m?.family_id||null,famCode:null};
    if(!m){boot=true;S.step=1;draw();return}
    const f=check(await sb.from('families').select('invite_code').eq('id',m.family_id).single());
    U.famCode=f.invite_code;
    await loadClass();subscribe();boot=true;draw();setTimeout(autoCheckApk,1500);
  }catch(e){boot=true;toast('Загрузка: '+errorMsg(e));draw()}finally{loading=false}
}
async function loadClass(){
 if(!U?.cls)return;
 const [c,mm,profiles,items]=await Promise.all([
   must(sb.from('classes').select('*').eq('code',U.cls).single()),
   must(sb.from('members').select('*').eq('class_code',U.cls)),
   must(sb.from('profiles').select('*')),
   must(sb.from('class_items').select('*').eq('class_code',U.cls).order('created_at',{ascending:false}))
 ]);
 C={name:c.name};
 const lookup=new Map(profiles.map(p=>[p.id,p]));
 mem=mm.map(m=>{const p=lookup.get(m.user_id)||{};return {id:m.user_id,admin:m.is_admin,fam:m.family_id,name:[p.first_name,p.last_name].filter(Boolean).join(' ')||'Родитель',phone:p.phone||'',kid:[p.child_first,p.child_last].filter(Boolean).join(' ')||''}});
 const reshape=x=>({id:x.id,t:new Date(x.created_at).getTime(),...x.payload});
 tasks=items.filter(x=>x.kind==='tasks').map(reshape);hw=items.filter(x=>x.kind==='homework').map(reshape);funds=items.filter(x=>x.kind==='funds').map(reshape);
 if(isAndroidApk()&&pushIs())syncDeadlineReminders({userId:uid,classCode:U.cls,familyId:U.fam,tasks,homework:hw,funds}).then(s=>{notificationStatus='Запланировано напоминаний: '+s.scheduled;if(S.tab==='more')draw()}).catch(e=>{notificationStatus='Ошибка планирования: '+(e.message||String(e));if(S.tab==='more')draw();console.warn('Не удалось обновить напоминания:',e)});
 if(boot)draw();
}
let pendingRefresh=false;
function subscribe(){
 if(channel)sb.removeChannel(channel);
 channel=sb.channel('yasno-'+U.cls)
 .on('postgres_changes',{event:'*',schema:'public',table:'class_items',filter:'class_code=eq.'+U.cls},evt=>{refreshSoon();if(evt.eventType==='INSERT'&&evt.new?.created_by!==uid){const names={tasks:'Новое дело',homework:'Новое домашнее задание',funds:'Новый сбор'};announce('Ясно',names[evt.new?.kind]||'Изменение в классе')}})
 .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'class_code=eq.'+U.cls},()=>refreshSoon())
 .subscribe();
}
function refreshSoon(){if(pendingRefresh)return;pendingRefresh=true;setTimeout(async()=>{pendingRefresh=false;try{await loadClass()}catch(e){console.warn(e)}},400)}
addEventListener('focus',()=>{if(uid&&U?.cls)refreshSoon()});
addEventListener('online',()=>{if(uid&&U?.cls)refreshSoon()});
setInterval(()=>{if(uid&&U?.cls&&!document.hidden)refreshSoon()},30000);
if(!cfg.url||cfg.url.includes('YOUR_PROJECT')||!cfg.anonKey||cfg.anonKey.includes('PASTE_')){
 $('#app').innerHTML='<div class="reg"><div class="logo">Ясно</div><h3>Подключите Supabase</h3><p>Заполните <b>supabase-config.js</b> и выполните <b>schema.sql</b>. Пошаговая инструкция — INSTALL_RU.md.</p></div>';
}else{
 sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){S.mode='recover';boot=true;draw();return}setTimeout(initSession,0)});
 initSession();
}
function regView(){
 const r=S.reg;
 if(S.mode==='recover')return `<div class="reg"><div class="logo">Ясно</div><h3>Новый пароль</h3><p class="s">Введите новый пароль для аккаунта.</p><input class="f" type="password" id="newpassword" placeholder="Пароль от 8 символов"><input class="f" type="password" id="newpassword2" placeholder="Повторите пароль"><div class="err" id="err"></div><div class="btns"><button class="btn wide" data-a="setPassword">Сохранить пароль</button></div></div>`;
 if(!uid){
  if(S.mode==='login')return `<div class="reg"><div class="logo">Ясно</div><h3>Вход в аккаунт</h3><p class="s">Данные синхронизируются на всех ваших телефонах.</p>
   <label class="fieldlabel">Электронная почта</label><input class="f" id="email" type="email" autocomplete="email" placeholder="name@example.com">
   <label class="fieldlabel">Пароль</label><input class="f" id="password" type="password" autocomplete="current-password" placeholder="Введите пароль">
   <div class="err" id="err"></div><div class="btns"><button class="btn wide" data-a="login">Войти</button></div>
   <button class="lnk" data-a="forgot">Забыли пароль?</button><br><button class="lnk" data-a="showRegister">Создать аккаунт</button></div>`;
  return `<div class="reg"><div class="logo">Ясно</div><h3>Регистрация родителя</h3><p class="s">Создайте защищённую учётную запись. Поля со звёздочкой обязательны.</p>
   <h2>Данные взрослого</h2>
   <label class="fieldlabel">Имя *</label><input class="f" id="n1" autocomplete="given-name" placeholder="Имя" value="${esc(r.first_name)}">
   <label class="fieldlabel">Фамилия *</label><input class="f" id="n2" autocomplete="family-name" placeholder="Фамилия" value="${esc(r.last_name)}">

function parse(text){
  const out=[];text.split(/(?<=[.!?])\s+|\n+/).forEach(s=>{
    s=s.trim();if(!s)return;
    const d=(s.match(/(сегодня|завтра|послезавтра|понедельник\w*|вторник\w*|сред\w*|четверг\w*|пятниц\w*|суббот\w*)/i)||[])[1]||'',w=d?d[0].toUpperCase()+d.slice(1):'';
    const m=s.match(/(\d[\d\s]*)\s*(₽|руб\w*|р\b|тг|грн)/i),isHw=/упр\.|№|стр\.|параграф|по (математике|русскому|литературе|английскому)/i.test(s),task=/надо|нужно|берём|принести|взять|подготовить|сдать/i.test(s),meet=/собрание|экскурси|утренник|концерт|олимпиад/i.test(s);
    if(!(m||isHw||task||meet))return;
    const t=s.replace(/^(Добрый (вечер|день)!|Напоминаю,?)\s*/i,'').replace(/[.!]+$/,'');
    if(isHw){const sb=/математ/i.test(s)?'Математика':/русск/i.test(s)?'Русский язык':/литерат/i.test(s)?'Литература':/англ/i.test(s)?'Английский язык':'Задание';out.push({k:'hw',subj:sb,text:t,date:dateWord(w)})}
    else if(m&&adm())out.push({k:'fund',title:t.slice(0,60),amount:parseInt(m[1].replace(/\s/g,''),10),date:dateWord(w)})
    else out.push({k:'task',title:t,date:dateWord(w)});
  });return out;
}

 delAcc:()=>{if(!confirm('Покинуть класс и удалить профиль приложения? Данные входа Supabase Auth останутся, пока администратор не удалит аккаунт на сервере.'))return;lock(async()=>{if(isAndroidApk())await clearDeadlineReminders();await rpc('leave_class');await initSession();toast('Вы покинули класс. Для полного удаления учётной записи обратитесь к администратору.')})}
};
const localAndroid=()=>isAndroidApk()?window.Capacitor?.Plugins?.LocalNotifications:null;
const pushIs=()=>isAndroidApk()?!!localStorage.yasnoNativeReminders:('Notification' in window&&Notification.permission==='granted'&&!!localStorage.yasnoPush);
const banner=()=>((!isAndroidApk()&&(!('Notification' in window)||Notification.permission==='denied'))||pushIs()||localStorage.pushHide)?'':'<div class="box"><div class="t">Разрешите уведомления</div><div class="s">'+(isAndroidApk()?'Напоминания к срокам дел, домашних заданий и сборов на этом телефоне.':'Уведомления браузера при открытом сайте.')+'</div><div class="btns"><button class="btn sm" data-a="pushEnable">Включить</button><button class="btn o sm" data-a="pushHide">Не сейчас</button></div></div>';
async function pushEnable(){
  if(isAndroidApk()){
    const plugin=localAndroid();
    if(!plugin)throw Error('Нативный плагин уведомлений не найден. Пересоберите APK с @capacitor/local-notifications.');
    const permission=await plugin.requestPermissions();
    if(permission.display!=='granted')throw Error('Разрешите уведомления для «Ясно» в настройках Android');
    localStorage.yasnoNativeReminders='1';
    const result=await syncDeadlineReminders({userId:uid,classCode:U?.cls,familyId:U?.fam,tasks,homework:hw,funds});
    toast('Напоминания по срокам включены: '+result.scheduled);draw();return;
  }
 if(!('Notification' in window)||!('serviceWorker' in navigator))throw Error('Этот браузер не поддерживает уведомления');
 const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Разрешите уведомления в настройках браузера');
 localStorage.yasnoPush='1';
 if(cfg.vapidPublicKey){
  const reg=await navigator.serviceWorker.ready;
  const base64=cfg.vapidPublicKey.replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64.padEnd(Math.ceil(base64.length/4)*4,'='));
  const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
  check(await sb.from('push_subscriptions').upsert({user_id:uid,endpoint:sub.endpoint,subscription:sub.toJSON()},{onConflict:'user_id,endpoint'}));
 }
 toast(cfg.vapidPublicKey?'Уведомления разрешены. Фоновая доставка требует запуска серверной функции.':'Уведомления разрешены для открытого приложения');draw();
}
async function pushDisable(){
  if(isAndroidApk()){
    await clearDeadlineReminders();
    delete localStorage.yasnoNativeReminders;toast('Напоминания выключены');draw();return;
  }
 try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){check(await sb.from('push_subscriptions').delete().eq('user_id',uid).eq('endpoint',sub.endpoint));await sub.unsubscribe()}}catch(e){console.warn(e)}
 delete localStorage.yasnoPush;toast('Уведомления выключены');draw();
}
async function announce(title,body){
 if(!pushIs())return;
 try{
  if(isAndroidApk()){
   const plugin=localAndroid();if(!plugin)return;
   await plugin.schedule({notifications:[{id:Math.floor(Math.random()*1000000)+2000,title,body,schedule:{at:new Date(Date.now()+1000)}}]});
  }else new Notification(title,{body,icon:'icon-192.png'});
 }catch(e){console.warn(e)}
}
const installUrl='https://github.com/potienkon5/Yasno-Project/releases/latest/download/yasno-release.apk';
function inviteUrl(param,value){
 if(isAndroidApk()||location.hostname==='localhost'||location.hostname==='127.0.0.1')return installUrl;
 const u=new URL(location.pathname,location.origin);
 if(param&&value)u.searchParams.set(param,value);
 return u.href;
}
async function shareIt(text,url){try{if(navigator.share){await navigator.share({title:'Ясно',text,url});return}}catch(e){return}try{await navigator.clipboard.writeText(text+'\n'+url);toast('Скопировано')}catch(e){toast(text)}}
document.addEventListener('click',e=>{if(e.target.id==='bg'){close();return}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#pl').innerHTML=plist()}});
// Напоминания пока приложение открыто; фоновые гарантии требуют Web Push / нативных планировщиков.
setInterval(()=>{if(!U||!pushIs()||isAndroidApk())return;const d=new Date();const hh=d.getHours(),mm=d.getMinutes(),key=isoL(d)+'-'+hh;if(!((hh===7&&mm===30)||(hh===18&&mm===0))||localStorage.yasnoReminder===key)return;
 localStorage.yasnoReminder=key;const today=hh===7?isoL(d):isoL(new Date(Date.now()+864e5));const count=tasks.filter(x=>!x.done&&x.date===today).length+hw.filter(x=>x.date===today&&!(x.doneBy||[]).includes(U.fam)).length+debts(U.fam);
 if(count)announce('Ясно · '+(hh===7?'На сегодня':'На завтра'),`Задач и неоплаченных сборов: ${count}`);
},30000);
/* ---------- first-run tour ---------- */
function tour(force){
  const steps=[['#fab','Сюда добавляйте всё','Дела, домашние задания и сборы. Можно вставить сообщение из родительского чата, приложение само найдёт важное.'],
  ['[data-tab=money]','Сборы денег','Староста создаёт сбор, родители отмечают «Мы сдали». Все видят, сколько собрано.'],
  ['[data-tab=cls]','Класс и приглашение','Здесь список родителей и код класса. Отправьте его только родителям вашего класса.'],
  ['[data-tab=more]','Ваша семья','Позовите маму, папу или ребёнка по коду семьи: бесплатно до трёх человек.']];
  let i=0;S.tab='home';draw();
  const hole=document.createElement('div'),tip=document.createElement('div');hole.className='hole';tip.className='tip';document.body.append(hole,tip);
  const end=()=>{hole.remove();tip.remove();localStorage.tourDone='1'};
  const go=()=>{const s=steps[i],el=$(s[0]);if(!el){end();return}const r=el.getBoundingClientRect();
    Object.assign(hole.style,{left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
    tip.style.bottom=innerHeight-r.top+18+'px';
    tip.innerHTML=`<b>${s[1]}</b><p>${s[2]}</p><div class="btns"><button class="lnk" data-t="x" style="color:var(--mute)">Пропустить</button><button class="btn sm" data-t="n">${i===steps.length-1?'Понятно':'Дальше'}</button></div>`};
  tip.addEventListener('click',e=>{const t=e.target.dataset.t;if(t==='x')end();if(t==='n'){i++;i>=steps.length?end():go()}});go();
}
